# Запуск: docker compose up --build
# Значения по умолчанию можно переопределить в файле .env рядом (см. .env.example)

services:

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Порт наружу не публикуется: БД доступна только сервисам внутри сети
    networks:
      - library-network
    restart: unless-stopped

  # Микросервис рейтингов
  rating-service:
    build:
      context: .
      dockerfile: rating-service/Dockerfile
    image: otus/rating-service:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9100:9100"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - library-network
    restart: unless-stopped

  # Библиотека
  book-service:
    build: .
    image: otus/book-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      rating-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-library}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-library}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-library}
      SPRING_H2_CONSOLE_ENABLED: "false"
      # Имя сервиса = DNS-имя контейнера в сети compose
      RATING_SERVICE_URL: http://rating-service:9100
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-hB/CZNqBZGLRo5BdnWnkZrhGiqhpOZXLxLdlyIbHWA7XP7iQfj7RG1Sq/kKjN3RBlCacPR7dSRCQV+5p6lTJUg==}
    networks:
      - library-network
    restart: unless-stopped

  # Zookeeper для Kafka
  zookeeper:
    container_name: zookeeper-book
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
    networks:
      - library-network

  # Kafka
  kafka:
    container_name: kafka-book
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - library-network

  # Kafka UI
  kafka-ui:
    container_name: kafka-ui-book
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - 9005:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - library-network

networks:
  library-network:
    driver: bridge

volumes:
  postgres-data:
