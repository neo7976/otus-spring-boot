<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">

    <h2>Вход в систему 🔐</h2>

    <!-- Сообщения -->
    <div id="errorMessage" class="message" style="display:none;"></div>
    <div id="successMessage" class="message success" style="display:none;"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" required autofocus/>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required/>
        </div>

        <button type="submit">Войти</button>
    </form>

</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        // Скрываем предыдущие сообщения
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (!username || !password) {
            errorMsg.textContent = 'Введите имя пользователя и пароль';
            errorMsg.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({username, password})
            });

            if (response.ok) {
                const data = await response.json();
                const token = data.token;

                // Сохраняем токен (например, в localStorage)
                localStorage.setItem('jwtToken', token);

                // Показываем успех и редиректим
                successMsg.textContent = '✅ Успешный вход! Перенаправление...';
                successMsg.style.display = 'block';

                // Через 1 секунду — переход
                setTimeout(() => {
                    // window.location.href = '/book/list';
                    window.location.href = '/';
                }, 1000);
            } else {
                const errorText = await response.text();
                errorMsg.textContent = errorText || 'Неверные учетные данные';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            console.error('Login error:', err);
            errorMsg.textContent = 'Ошибка сети: ' + err.message;
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
