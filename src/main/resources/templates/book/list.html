<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список книг</title>
    <link rel="stylesheet" th:href="@{/css/book-list.css}">
</head>
<body>

<div class="container">

    <h1>📚 Список книг</h1>

    <!-- Форма фильтрации -->
    <div class="filter-box">
        <form id="filterForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="title">Название:</label>
                    <input type="text" id="title" name="title" placeholder="Поиск по названию"/>
                </div>
                <div class="form-group">
                    <label for="authorId">Автор:</label>
                    <select id="authorId" name="authorId">
                        <option value="">Все авторы</option>
                        <option th:each="author : ${authors}"
                                th:value="${author.authorId}"
                                th:text="${author.name}">Автор
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="genreId">Жанр:</label>
                    <select id="genreId" name="genreId">
                        <option value="">Все жанры</option>
                        <option th:each="genre : ${genres}"
                                th:value="${genre.genreId}"
                                th:text="${genre.name}">Жанр
                        </option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">🔍 Поиск</button>
                <button type="button" onclick="resetForm()" class="btn btn-secondary">🔄 Сбросить</button>
            </div>
        </form>
    </div>

    <!-- Индикатор загрузки -->
    <div id="loading" class="loading" style="display:none;">⏳ Загрузка...</div>
    <div id="error" class="error"></div>

    <!-- Таблица книг -->
    <div class="table-container">
        <table id="booksTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Автор</th>
                <th>Жанр</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="booksBody">
            <!-- Сюда подгружаем данные -->
            </tbody>
        </table>
    </div>

    <!-- Модальное окно комментариев -->
    <div id="commentsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCommentsModal()">&times;</span>
            <h3>💬 Комментарии к книге <span id="modalBookTitle"></span></h3>
            <div id="modalCommentsList" class="comments-list"></div>
            <button onclick="closeCommentsModal()" class="btn btn-secondary">Закрыть</button>
        </div>
    </div>

    <!-- Ссылка на главную -->
    <a href="/" class="back-link">← Назад на главную</a>

</div>

<script>
    const form = document.getElementById('filterForm');
    const booksBody = document.getElementById('booksBody');
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error');

    // Загружаем книги при старте
    document.addEventListener('DOMContentLoaded', () => {
        fetchBooks();
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        fetchBooks();
    });

    function resetForm() {
        form.reset();
        fetchBooks();
    }

    function fetchBooks() {
        const params = new URLSearchParams();
        const title = document.getElementById('title').value;
        const authorId = document.getElementById('authorId').value;
        const genreId = document.getElementById('genreId').value;

        if (title) params.append('title', title);
        if (authorId) params.append('authorId', authorId);
        if (genreId) params.append('genreId', genreId);

        params.append('sortBy', 'id');
        params.append('orderBy', 'asc');
        params.append('pageNumber', '0');
        params.append('pageSize', '100');

        const url = `/book/api/v1?${params.toString()}`;

        loading.style.display = 'block';
        errorDiv.textContent = '';

        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error('Ошибка запроса');
                return response.json();
            })
            .then(data => {
                renderBooks(data.data || []);
            })
            .catch(err => {
                console.error(err);
                errorDiv.textContent = 'Не удалось загрузить книги: ' + err.message;
            })
            .finally(() => {
                loading.style.display = 'none';
            });
    }

    function renderBooks(books) {
        booksBody.innerHTML = '';
        if (books.length === 0) {
            booksBody.innerHTML = '<tr><td colspan="5" class="no-data">Книги не найдены</td></tr>';
            return;
        }

        books.forEach(book => {
            const row = document.createElement('tr');
            const title = escapeHtml(book.title || '');
            const authorName = escapeHtml(book.author?.name || '');
            const genreName = escapeHtml(book.genre?.name || '');
            const bookId = book.bookId || '';

            row.innerHTML = `
                <td>${bookId}</td>
                <td>${title}</td>
                <td>${authorName}</td>
                <td>${genreName}</td>
                <td>
                    <button type="button" onclick="window.location.href='/book/view/${bookId}'" class="btn btn-sm btn-outline-primary">
                        Добавить комментарий
                    </button>
                    <button type="button" onclick="showComments(${bookId}, \`${title}\`)" class="btn btn-sm btn-outline-info">
                        Комментарии
                    </button>
                </td>
            `;
            booksBody.appendChild(row);
        });
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    async function showComments(bookId, bookTitle) {
        document.getElementById('modalBookTitle').textContent = bookTitle;
        const commentsList = document.getElementById('modalCommentsList');
        commentsList.innerHTML = 'Загрузка...';
        document.getElementById('commentsModal').style.display = 'flex';

        try {
            const response = await fetch(`/book/api/v1/${bookId}`);
            if (!response.ok) throw new Error('Не удалось загрузить книгу');

            const result = await response.json();
            if (!result.success) throw new Error('Ошибка сервера');

            const book = result.value;
            const comments = book.comments || [];

            if (comments.length === 0) {
                commentsList.innerHTML = '<p class="no-comments">Нет комментариев</p>';
                return;
            }

            let html = '<ul class="comment-items">';
            comments.forEach(comment => {
                const text = escapeHtml(comment.text || '');
                const username = escapeHtml(comment.user?.username || 'Аноним');
                const createAt = comment.createAt
                    ? new Date(comment.createAt).toLocaleString('ru-RU')
                    : '—';

                html += `
                    <li class="comment-item">
                        <div class="comment-header">
                            <strong>${username}</strong> — <small>${createAt}</small>
                        </div>
                        <p class="comment-text">${text}</p>
                    </li>
                `;
            });
            html += '</ul>';

            commentsList.innerHTML = html;
        } catch (err) {
            commentsList.innerHTML = `<div class="error-message">Ошибка: ${err.message}</div>`;
        }
    }

    function closeCommentsModal() {
        document.getElementById('commentsModal').style.display = 'none';
    }

    // Закрывать по клику на фон
    document.getElementById('commentsModal').addEventListener('click', (e) => {
        if (e.target.id === 'commentsModal') {
            closeCommentsModal();
        }
    });
</script>

</body>
</html>
