<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Книга</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="container">

    <h1>💬 Добавить комментарий</h1>
    <p class="book-id">Книга ID: <strong th:text="${bookId}">1</strong></p>

    <!-- Рейтинг приходит из rating-service через book-service -->
    <div class="form-card">
        <p>Рейтинг: <strong id="ratingValue">—</strong></p>
        <div>
            Ваша оценка:
            <button type="button" class="btn btn-sm" onclick="rateBook(1)">1</button>
            <button type="button" class="btn btn-sm" onclick="rateBook(2)">2</button>
            <button type="button" class="btn btn-sm" onclick="rateBook(3)">3</button>
            <button type="button" class="btn btn-sm" onclick="rateBook(4)">4</button>
            <button type="button" class="btn btn-sm" onclick="rateBook(5)">5</button>
        </div>
    </div>

    <div class="form-card">
        <form id="commentForm">
            <div class="form-group">
                <label for="commentText">Ваш комментарий:</label>
                <textarea id="commentText" placeholder="Напишите свой отзыв..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить комментарий</button>
        </form>
    </div>

    <div id="message" class="message-box"></div>

    <div class="comments-section">
        <h2>Комментарии (<span id="commentsCount">0</span>)</h2>
        <div id="commentsList" class="comments-list">
            <!-- Комментарии подгрузятся сюда -->
        </div>
    </div>

    <a href="/book/list" class="back-link">← Назад к списку</a>

</div>

<script th:src="@{/js/auth.js}"></script>
<script th:inline="javascript">
    requireAuth();

    // Thymeleaf подставит bookId
    const bookId = /*[[${bookId}]]*/ 0;
    console.log("Book ID:", bookId); // для отладки

    if (!bookId || bookId <= 0) {
        document.getElementById('message').className = 'message-box error';
        document.getElementById('message').textContent = 'Ошибка: не указан ID книги';
    }

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = document.getElementById('commentText').value.trim();
        if (!text) return;

        try {
            // 🔥 ИСПРАВЛЕНО: правильный URL
            const response = await authFetch(`/comment/api/v1/add-comment/${bookId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text })
            });

            const result = await response.json();
            const messageDiv = document.getElementById('message');

            if (response.ok && result.success) {
                messageDiv.className = 'message-box success';
                messageDiv.textContent = '✅ Комментарий успешно добавлен!';
                document.getElementById('commentText').value = '';
                loadComments(); // обновить список
            } else {
                messageDiv.className = 'message-box error';
                messageDiv.textContent = '❌ Ошибка: ' + (result.msg || 'не удалось добавить комментарий');
            }
        } catch (err) {
            console.error(err);
            document.getElementById('message').className = 'message-box error';
            document.getElementById('message').textContent = '❌ Ошибка сети: ' + err.message;
        }
    });


    // Загрузка комментариев
    function renderRating(rating) {
        const el = document.getElementById('ratingValue');
        if (!rating || !rating.available) {
            el.textContent = 'временно недоступен';
        } else if (rating.count === 0) {
            el.textContent = 'оценок пока нет';
        } else {
            el.textContent = `${rating.average} ★ (оценок: ${rating.count})`;
        }
    }

    async function rateBook(score) {
        const messageDiv = document.getElementById('message');
        const response = await authFetch(`/book/api/v1/${bookId}/rating`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({score})
        });
        const result = await response.json();
        if (response.ok && result.success) {
            renderRating(result.value);
            messageDiv.className = 'message-box success';
            messageDiv.textContent = '✅ Оценка сохранена';
        } else {
            messageDiv.className = 'message-box error';
            messageDiv.textContent = '❌ ' + (result.msg || 'Не удалось сохранить оценку');
        }
    }

    async function loadComments() {
        try {
            const response = await authFetch(`/book/api/v1/${bookId}`);
            if (!response.ok) throw new Error('Не удалось загрузить книгу');

            const result = await response.json();
            if (!result.success) throw new Error('Ошибка сервера');

            const book = result.value;
            renderRating(book.rating);
            const comments = book.comments || [];

            const list = document.getElementById('commentsList');
            const count = document.getElementById('commentsCount');
            count.textContent = comments.length;

            if (comments.length === 0) {
                list.innerHTML = '<p class="no-comments">Пока нет комментариев.</p>';
                return;
            }

            let html = '<ul class="comment-items">';
            comments.forEach(comment => {
                const text = escapeHtml(comment.text || '');
                const username = escapeHtml(comment.user?.username || 'Аноним');
                const createAt = comment.createAt
                    ? new Date(comment.createAt).toLocaleString('ru-RU')
                    : '—';

                html += `
                    <li class="comment-item">
                        <div class="comment-header">
                            <strong>${username}</strong> — <small>${createAt}</small>
                        </div>
                        <p class="comment-text">${text}</p>
                    </li>
                `;
            });
            html += '</ul>';
            list.innerHTML = html;
        } catch (err) {
            console.error(err);
            document.getElementById('commentsList').innerHTML = `<div class="error-message">Не удалось загрузить комментарии</div>`;
        }
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Загружаем комментарии при старте
    document.addEventListener('DOMContentLoaded', () => {
        if (bookId > 0) {
            loadComments();
        }
    });
</script>

</body>
</html>
