<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить книгу</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form div { margin: 15px 0; }
        label { display: inline-block; width: 120px; }
        input, select, button { padding: 6px; margin-right: 10px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<h1>Добавить новую книгу</h1>

<div id="message"></div>

<form id="bookForm">
    <div>
        <label>Название:</label>
        <input type="text" id="title" name="title" required />
    </div>
    <div>
        <label>Автор:</label>
        <select id="authorId" name="authorId" required>
            <option value="">-- Выберите автора --</option>
            <option th:each="author : ${authors}"
                    th:value="${author.authorId}"
                    th:text="${author.name}">Автор</option>
        </select>
    </div>
    <div>
        <label>Жанр:</label>
        <select id="genreId" name="genreId" required>
            <option value="">-- Выберите жанр --</option>
            <option th:each="genre : ${genres}"
                    th:value="${genre.genreId}"
                    th:text="${genre.name}">Жанр</option>
        </select>
    </div>
    <div>
        <button type="submit">Создать книгу</button>
        <a href="/book/list">← Назад к списку</a>
    </div>
</form>

<script>
    document.getElementById('bookForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('title').value;
        const authorId = document.getElementById('authorId').value;
        const genreId = document.getElementById('genreId').value;

        const bookDto = {
            title: title,
            author: { authorId: parseInt(authorId) },
            genre: { genreId: parseInt(genreId) }
        };

        const messageDiv = document.getElementById('message');
        messageDiv.className = '';
        messageDiv.textContent = 'Отправка...';

        try {
            // Получаем CSRF-токен из куки
            const csrfToken = getCookie('XSRF-TOKEN');

            const response = await fetch('/book/api/v1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-XSRF-TOKEN': csrfToken // ← передаём токен
                },
                body: JSON.stringify(bookDto)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                messageDiv.className = 'success';
                messageDiv.textContent = 'Книга успешно создана!';
                document.getElementById('bookForm').reset();
            } else {
                throw new Error(result.msg || 'Ошибка создания книги');
            }
        } catch (err) {
            messageDiv.className = 'error';
            messageDiv.textContent = 'Ошибка: ' + err.message;
        }
    });

    // Функция для получения куки
    function getCookie(name) {
        let value = "; " + document.cookie;
        let parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
    }
</script>

</body>
</html>
