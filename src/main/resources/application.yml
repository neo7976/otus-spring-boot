spring:
  application:
    name: otus-spring-boot
  # По умолчанию H2 в памяти; в Docker переопределяется переменными SPRING_DATASOURCE_*.
  # Драйвер и диалект Hibernate определяются по URL автоматически.
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:liquibase/changelog.xml
  h2:
    console:
      enabled: true
#  sql:
#    init:
#      mode: always
server:
  port: 9000

logging:
  file:
    # В Docker отключается (LOGGING_FILE_NAME=""): логи идут только в stdout
    name: ${LOGGING_FILE_NAME:logs/otus-spring-boot.log}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,logfile
  endpoint:
    health:
      # Детали (БД, диск, каталог книг) видит только администратор
      show-details: when-authorized
      roles: ADMIN

info:
  app:
    name: '@project.name@'
    description: Библиотека книг
    version: '@project.version@'

rating-service:
  url: ${RATING_SERVICE_URL:http://localhost:9100}

feign:
  circuitbreaker:
    # Оборачивает каждый вызов Feign-клиента в circuit breaker и включает fallback
    enabled: true
  client:
    config:
      rating-service:
        connect-timeout: 1000
        read-timeout: 2000

resilience4j:
  timelimiter:
    configs:
      default:
        # По умолчанию 1s — меньше read-timeout Feign, увеличиваем
        timeout-duration: 3s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic:
    book-ratings: book-ratings
  producer:
    acks: all
    retries: 3
    properties:
      max.block.ms: 5000
      request.timeout.ms: 5000
      delivery.timeout.ms: 10000

jwt:
  issuer: BOOK-SERVICE
  # Base64, >= 256 бит. В проде задаётся через переменную окружения JWT_SECRET
  secret: ${JWT_SECRET:hB/CZNqBZGLRo5BdnWnkZrhGiqhpOZXLxLdlyIbHWA7XP7iQfj7RG1Sq/kKjN3RBlCacPR7dSRCQV+5p6lTJUg==}
  expiration: 30m
